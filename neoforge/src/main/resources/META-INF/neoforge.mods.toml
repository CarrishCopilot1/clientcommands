modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/CarrishCopilot1/clientcommands/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displaySide = "CLIENT"
authors = "earthcomputer (Fabric original); ported to NeoForge"
description = '''
Client-side enchantment prediction & manipulation, ported from clientcommands (Fabric) to NeoForge 1.21.1.
Provides /cenchant, /ccrackrng and the enchantment table overlay.
'''

[[mixins]]
config = "enchantpredict.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "[${mc_version}]"
ordering = "NONE"
side = "CLIENT"
